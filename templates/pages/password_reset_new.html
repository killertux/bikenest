{% extends "layouts/base.html" %}
{% block content %}
<section class="mx-auto flex max-w-shell justify-center px-4 py-16 lg:px-8">
  <div class="w-full max-w-md">
    <h1 class="font-display text-2xl font-bold tracking-tight">{{ tr.t("auth.reset_new_title") }}</h1>
    <p class="mt-2 text-muted">{{ tr.t("auth.reset_new_subtitle") }}</p>
    {% if error.is_some() %}
      <div class="mt-4 rounded-lg border border-danger/30 bg-danger/10 px-4 py-3 text-sm text-danger" role="alert">{{ error.as_deref().unwrap_or("") }}</div>
    {% endif %}
    <form action="/password-reset/new" method="post" class="mt-6 space-y-4">
      <input type="hidden" name="csrf" value="{{ layout.csrf }}" />
      <input type="hidden" name="token" value="{{ token }}" />
      <div>
        <label for="password" class="mb-1 block text-sm font-medium">{{ tr.t("auth.password") }}</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" class="w-full rounded-lg border border-border bg-surface px-3 py-2 text-fg outline-none focus:border-accent" />
        <p class="mt-1 text-xs text-muted">{{ tr.t("auth.password_hint") }}</p>
      </div>
      <button type="submit" class="w-full rounded-lg bg-accent-strong px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-accent-dark">{{ tr.t("password.set_submit") }}</button>
    </form>
  </div>
</section>
{% endblock %}
