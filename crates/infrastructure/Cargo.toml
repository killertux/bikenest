[package]
name = "bikenest-infrastructure"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
aws-config = "1.11.0"
aws-credential-types = "1.3.0"
aws-sdk-s3 = "1.144.0"
aws-smithy-types = "1.6.2"
bikenest-application = { version = "0.1.0", path = "../application" }
bikenest-domain = { version = "0.1.0", path = "../domain" }
chrono = "0.4"
chrono-tz = "0.10"
cron = "0.12"
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "tokio1", "builder"] }
rand = "0.8"
redis = { version = "1.6.0", features = ["aio", "cluster-async", "tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1"

[dev-dependencies]
bikenest-test-support = { path = "../test-support" }
