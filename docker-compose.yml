# Development stack: `docker compose up` starts the database, the app
# (auto-recompiling via cargo-watch) and the Tailwind CSS watcher.
# DB-only: `docker compose up -d db`.

services:
  db:
    image: imresamu/postgis:17-3.5  # arm64-compatible PostGIS build
    container_name: bikenest-db
    environment:
      POSTGRES_USER: bikenest
      POSTGRES_PASSWORD: bikenest
      POSTGRES_DB: bikenest
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - bikenest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikenest -d bikenest"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Rust app, recompiled on change. First start compiles the workspace
  # (several minutes); the named volumes cache the target dir and the cargo
  # registry, so later starts are fast. SQLx compile-time query checking
  # talks to the `db` service.
  app:
    image: rust:1.95
    working_dir: /app
    environment:
      DATABASE_URL: postgres://bikenest:bikenest@db:5432/bikenest
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info
      # Object storage (Ledger #7). MEDIA_ROOT defaults to <repo>/media, which
      # is the mounted /app/media; the signing secret is dev-only here.
      MEDIA_ROOT: /app/media
      MEDIA_SIGNING_SECRET: dev-compose-media-secret
      # Object storage (Ledger #7): MinIO (S3-compatible) for dev. The app
      # serves media via signed /media URLs; MinIO is the backing store.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: bikenest
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      # Rate limiter (Ledger #6): ValKey backend, shared across auth/photo/
      # contribution/moderation. Ephemeral keys (TTL), so no persistence.
      VALKEY_URL: valkey://valkey:6379
      # Email: the app uses SMTP in dev, delivering to Mailpit (see below).
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: BikeNest <no-reply@bikenest.local>
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      valkey:
        condition: service_healthy
      minio:
        condition: service_started
    # NOTE: literal block (|) with the `cargo watch` invocation on ONE physical
    # line. A folded (>) block keeps extra-indented lines as newlines, which in
    # sh would terminate `exec cargo watch` before its flags — cargo-watch would
    # then fall back to its default `cargo check` and never start the server.
    command:
      - sh
      - -c
      - |
        if ! cargo watch --version >/dev/null 2>&1; then echo 'installing cargo-watch (first start only)…'; cargo install --locked cargo-watch; fi
        exec cargo watch -w crates -w migrations -w templates -w Cargo.toml -c -x 'run -q -p bikenest-web'

  # Tailwind CSS 4.3 watcher: rebuilds web/static/css/app.css as the entry
  # or templates change. node_modules lives in a named volume so the Linux
  # install never clobbers a host-side install.
  #
  # Uses a glibc image (node:24-slim), NOT alpine: Tailwind 4's native `oxide`
  # engine (@tailwindcss/oxide) has no reliable musl build, so on alpine the
  # `tailwindcss` binary crashes on start and the service dies immediately.
  css:
    image: node:24-slim
    working_dir: /app
    environment:
      NODE_ENV: development
    # Tailwind 4's `--watch` exits cleanly when stdin reaches EOF; under
    # `docker compose up -d` there is no terminal, so keep stdin open + a TTY
    # allocated, otherwise the watcher stops the moment it starts.
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "
        (npm ci --no-audit --no-fund || npm install --no-audit --no-fund) &&
        npm run build:assets &&
        npm run watch:css
      "

  # Mailpit (dev): SMTP sink + web UI so every sent email is viewable and
  # auditable. The app (EMAIL_PROVIDER=smtp) delivers here via SMTP_HOST:mailpit.
  mailpit:
    image: axllent/mailpit:latest
    container_name: bikenest-mailpit
    ports:
      - "1025:1025"   # SMTP relay (what the app connects to)
      - "8025:8025"   # web UI: http://localhost:8025

  # ValKey (Ledger #6): shared rate-limit store behind the ValKeyRateLimiter
  # (single-node path, VALKEY_URL). Redis-compatible. Ephemeral by design
  # (no persistence — rate-limit keys carry their own TTL), so the data volume is
  # optional and the image is easy to scrape clean.
  valkey:
    image: valkey/valkey:8
    container_name: bikenest-valkey
    command:
      - "valkey-server"
      - "--port"
      - "6379"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    ports:
      - "${VALKEY_HOST_PORT:-6380}:6379"
    volumes:
      - bikenest-valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO (Ledger #7): S3-compatible object storage for dev media. The app
  # (S3_* env) writes here and serves media via signed /media URLs. Console at
  # http://localhost:9001 (minioadmin/minioadmin).
  minio:
    image: minio/minio:latest
    container_name: bikenest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - bikenest-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket the app writes to (idempotent).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/bikenest"

  # Real ValKey cluster (Ledger #6, cluster path) is optional — see
  # docker-compose.valkey-cluster.yml (single cluster-enabled node covering all
  # slots; portable on Docker Desktop for Mac).

volumes:
  bikenest-pgdata:
  bikenest-valkeydata:
  bikenest-minio:
  cargo-target:
  cargo-registry:
  node_modules:
